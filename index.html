<style>
[hidden] { display: none !important; }
/* Sadda Arena: the 3D arena fills the stage; menus ride a bottom sheet (a side sheet on wide
   screens) so the scene stays in view. Look: night-arcade navy with candy-bright
   yellow, pink and cyan, chunky pressable buttons, one rounded display face for
   both Arabic and English. */
:root {
  color-scheme: dark;
  --ink: #090c26;
  --navy: #121845;
  --navy-2: #1c2464;
  --navy-3: #283394;
  --line: rgba(170, 190, 255, 0.16);
  --text: #f4f6ff;
  --muted: #a7b0e2;
  --yellow: #ffd23f; --yellow-2: #ffae00; --yellow-edge: #b96f00;
  --pink: #ff4f7b; --pink-2: #e8265a; --pink-edge: #8e1638;
  --cyan: #2de2e6; --cyan-edge: #0f8f96;
  --green: #3ee08f;
  --me: #ffd23f;
  --font: "Baloo Bhaijaan 2", "Baloo 2", system-ui, -apple-system, "Segoe UI", "Geeza Pro", Tahoma, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ink); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.3;
  overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
img { -webkit-user-drag: none; }
:root { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px); }
.app { position: fixed; inset: 0; overflow: hidden; overflow: clip; background: var(--ink); }   /* the arena fills the whole screen, under the status bar and the home bar; buttons stay inside the safe area */
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ---- logo ---- */
.logo { margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 800; }
.logo-ar {
  font-size: 2.35rem; line-height: 1; font-weight: 800; padding-top: 0.08em;
  background: linear-gradient(180deg, #fff8cf 0%, #ffd23f 48%, #ff9a00 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 0.6px #2a1460; filter: drop-shadow(0 2px 0 #2a1460) drop-shadow(0 3px 0 #2a1460) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45));
}
.logo-en { display: flex; flex-direction: column; font-size: 1.05rem; font-weight: 800; line-height: 0.95; letter-spacing: 0.12em; color: var(--text); text-shadow: 0 2px 0 #2a1460; }
.logo-en i { font-style: normal; font-size: 0.68rem; letter-spacing: 0.42em; color: var(--cyan); margin-top: 2px; }
.logo.big { flex-direction: column; gap: 2px; }
.logo.big .logo-ar { font-size: 4.4rem; }
.logo.big .logo-en { align-items: center; font-size: 1.5rem; }

/* ---- top bar ---- */
.topbar { position: absolute; top: var(--st); inset-inline: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.app[data-screen="game"] .topbar, .app[data-screen="results"] .topbar { display: none; }
.app[data-screen="game"] .toast { top: auto; bottom: calc(108px + var(--sb)); }
.chips { display: flex; gap: 6px; }
.chip {
  min-height: 40px; padding: 6px 13px; border: 0; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
  font-weight: 700; font-size: 0.86rem; color: var(--text); background: rgba(14, 18, 56, 0.78); box-shadow: inset 0 0 0 1.5px var(--line), 0 4px 0 rgba(0, 0, 0, 0.35);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
}
.chip.icon { padding-inline: 10px; }
.chip.lang { background: linear-gradient(180deg, #3a46c4, #2a3399); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 4px 0 #161c62; }
.chip.lang span { font-size: 0.92rem; }
.chip.gold { background: linear-gradient(180deg, #ffe27a, var(--yellow-2)); color: var(--ink); box-shadow: 0 4px 0 var(--yellow-edge); }
.chip:active { transform: translateY(2px); }
.chip.round { width: 44px; height: 44px; min-height: 44px; padding: 0; justify-content: center; }
.chip.round.mini { width: 38px; height: 38px; min-height: 38px; background: rgba(9, 12, 38, 0.5); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.14); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.hud-pad { width: 38px; flex: none; }

/* ---- sheets ---- */
.screen { position: absolute; inset: var(--st) var(--sr) var(--sb) var(--sl); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
.panel {
  pointer-events: auto; display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 18px;
  max-height: 62%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: linear-gradient(180deg, rgba(30, 38, 108, 0.94), rgba(13, 17, 52, 0.98));
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-radius: 28px 28px 0 0; box-shadow: inset 0 2px 0 rgba(140, 160, 255, 0.28), 0 -14px 40px rgba(0, 0, 0, 0.45);
}
#s-lobby .panel { max-height: 70%; }
#s-results .panel { max-height: 64%; }
@media (min-aspect-ratio: 6/5) and (min-width: 700px) {
  .screen { flex-direction: row; align-items: stretch; }
  .panel, #s-lobby .panel, #s-results .panel { width: min(440px, 45%); max-height: none; margin: 12px; border-radius: 28px; }
  .panel::before { content: ""; flex: 1 1 0; }
  #s-lobby .panel::before, #s-results .panel::before { flex: 0 0 0; }
  .topbar { inset-inline-end: calc(min(440px, 45%) + 24px); }
  .plate { position: absolute; bottom: 20px; inset-inline-start: 0; width: calc(100% - min(440px, 45%) - 24px); }
}
.lbl { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
[dir="rtl"] .lbl { letter-spacing: 0; font-size: 0.86rem; }
.count { font-variant-numeric: tabular-nums; color: var(--text); }
.note { margin: 0; font-size: 0.84rem; color: var(--muted); }
.note:empty { display: none; }
.note.info { padding: 8px 12px; border-radius: 14px; background: rgba(45, 226, 230, 0.08); box-shadow: inset 0 0 0 1.5px rgba(45, 226, 230, 0.25); font-size: 0.8rem; }

.plate { display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 14px 12px; pointer-events: none; }
.plate > * { pointer-events: auto; }
.plate-name { min-width: 160px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.plate-name b { font-size: 2.3rem; font-weight: 800; line-height: 1; color: var(--me); -webkit-text-stroke: 1px rgba(0, 0, 0, 0.35); filter: drop-shadow(0 3px 0 rgba(9, 12, 38, 0.9)); }
.plate-name span { margin-top: 4px; padding: 2px 12px; border-radius: 99px; font-size: 0.8rem; font-weight: 700; color: var(--text); background: rgba(9, 12, 38, 0.7); }
.arrow { width: 48px; height: 48px; border: 0; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: linear-gradient(180deg, #ffe27a, var(--yellow-2)); box-shadow: 0 4px 0 var(--yellow-edge), 0 8px 14px rgba(0, 0, 0, 0.35); }
.arrow:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--yellow-edge); }
[dir="rtl"] .arrow svg { transform: scaleX(-1); }

.field {
  width: 100%; min-width: 0; padding: 11px 14px; font: 700 1rem var(--font); color: var(--text);
  background: rgba(9, 12, 38, 0.75); border: 2px solid var(--line); border-radius: 16px; outline: none;
  -webkit-user-select: text; user-select: text;
}
.field:focus-visible { border-color: var(--cyan); }
.field::placeholder { color: rgba(167, 176, 226, 0.6); font-weight: 500; }
.code-in { flex: 1 1 0; text-align: center; font-size: 1.4rem; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; padding-block: 7px; }
.code-in::placeholder { letter-spacing: 0.1em; font-size: 0.95rem; }
.link-in { font-size: 0.75rem; padding: 6px 8px; margin-top: 6px; }

.btn {
  min-height: 54px; padding: 10px 16px; border: 0; border-radius: 18px; font-size: 1.22rem; font-weight: 800; line-height: 1.1;
  color: var(--text); background: linear-gradient(180deg, var(--navy-3), var(--navy-2)); margin-bottom: 5px;
  box-shadow: 0 5px 0 #0a0e33, inset 0 2px 0 rgba(255, 255, 255, 0.18);
}
[dir="ltr"] .btn { letter-spacing: 0.02em; }
.btn.primary { background: linear-gradient(180deg, #ffe680, var(--yellow) 45%, var(--yellow-2)); color: #1d1240; box-shadow: 0 5px 0 var(--yellow-edge), inset 0 2px 0 rgba(255, 255, 255, 0.6); }
.btn.pink { background: linear-gradient(180deg, #ff7d9c, var(--pink) 50%, var(--pink-2)); color: #fff; box-shadow: 0 5px 0 var(--pink-edge), inset 0 2px 0 rgba(255, 255, 255, 0.4); }
.btn.ghost { background: rgba(45, 226, 230, 0.06); color: var(--cyan); box-shadow: inset 0 0 0 2.5px rgba(45, 226, 230, 0.6), 0 5px 0 rgba(0, 0, 0, 0.3); }
.btn.big { min-height: 62px; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #0a0e33; }
.btn.primary:active:not(:disabled) { box-shadow: 0 1px 0 var(--yellow-edge), inset 0 2px 0 rgba(255, 255, 255, 0.6); }
.btn.pink:active:not(:disabled) { box-shadow: 0 1px 0 var(--pink-edge); }
.btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .step button:focus-visible, .arrow:focus-visible, .modes button:focus-visible, .mapc:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.btn.pulse { animation: pulse 1.2s ease-in-out infinite; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.actions.row { flex-direction: row; }
.actions.row .btn { flex: 1 1 0; min-width: 0; }
.actions.row .btn.grow { flex: 2 1 0; }
.panel > .actions.foot { position: sticky; bottom: -18px; z-index: 2; margin: auto -16px -18px; padding: 10px 16px 14px; background: rgba(13, 17, 52, 0.98); border-top: 1.5px solid var(--line); }
.joinrow { display: flex; gap: 8px; }
.joinrow .btn { flex: 0 0 34%; }
#b-create { display: flex; flex-direction: column; align-items: center; gap: 1px; }
#b-create small { font-size: 0.74rem; font-weight: 700; opacity: 0.72; letter-spacing: 0; }

.pick-ch { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; }
.chb { padding: 0; border: 0; background: none; min-width: 0; border-radius: 16px; aspect-ratio: 1; position: relative; transition: transform 0.15s; }
.chb img { width: 100%; height: 100%; display: block; border-radius: 16px; background: linear-gradient(180deg, #2c3790, #151b52); box-shadow: inset 0 0 0 2px rgba(170, 190, 255, 0.16); opacity: 0.78; }
.chb.sel { transform: translateY(-3px) scale(1.12); z-index: 1; }
.chb.sel img { opacity: 1; background: linear-gradient(180deg, #3d4bc0, #1c2464); box-shadow: 0 0 0 3px var(--me), 0 6px 0 rgba(0, 0, 0, 0.35); }
.pick-col { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; justify-items: center; }
.sw { width: 30px; height: 30px; border: 0; padding: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0) 45%), var(--c); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.45); }
.sw.sel { box-shadow: 0 0 0 3px var(--ink), 0 0 0 6px var(--text); }
.sw.taken { opacity: 0.18; cursor: default; }

/* ---- lobby ---- */
.lobhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 12px; border-radius: 20px; background: rgba(9, 12, 38, 0.55); box-shadow: inset 0 0 0 1.5px var(--line); }
.lobcode { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; min-width: 0; }
.code { font-size: clamp(2.1rem, 11vw, 3.1rem); font-weight: 800; line-height: 0.9; letter-spacing: 0.1em; color: var(--yellow); text-shadow: 0 4px 0 #2a1460; white-space: nowrap; }
.qrbox { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 0.7rem; font-weight: 700; color: var(--muted); flex: none; }
.qrbox canvas { width: 96px; height: 96px; image-rendering: pixelated; border-radius: 12px; }
.seats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.seat { display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 6px 2px 6px; border-radius: 16px; background: rgba(9, 12, 38, 0.55); box-shadow: inset 0 -4px 0 var(--c, rgba(170, 190, 255, 0.1)); }
.seat img { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(180deg, #2c3790, #151b52); }
.seat b { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8rem; font-weight: 800; }
.seat i { font-style: normal; font-size: 0.66rem; font-weight: 700; color: var(--muted); min-height: 1.1em; }
.seat.me { background: rgba(255, 210, 63, 0.14); }
.seat.dim { opacity: 0.55; }
.seat.empty { opacity: 0.4; }
.seat.empty img { visibility: hidden; height: 16px; }
.seat.empty b { font-weight: 600; font-size: 0.7rem; color: var(--muted); }
.setup { display: flex; flex-direction: column; gap: 9px; padding: 12px; border-radius: 20px; background: rgba(9, 12, 38, 0.45); box-shadow: inset 0 0 0 1.5px var(--line); }
.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.modes button { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 8px 4px 7px; border: 0; border-radius: 16px; background: linear-gradient(180deg, #232c78, #161d55); box-shadow: inset 0 0 0 2px var(--line), 0 4px 0 rgba(0, 0, 0, 0.35); }
.modes i { font-style: normal; font-size: 1.45rem; line-height: 1.2; }
.modes b { font-size: 1.02rem; font-weight: 800; }
.modes small { font-size: 0.66rem; font-weight: 600; color: var(--muted); line-height: 1.15; text-align: center; }
.modes button.on { background: linear-gradient(180deg, #3a2fa0, #241b78); box-shadow: inset 0 0 0 3px var(--yellow), 0 4px 0 rgba(0, 0, 0, 0.35); }
.modes button.on b { color: var(--yellow); }
.kv { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.6fr); gap: 10px; align-items: center; }
.kvs { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.6fr); gap: 7px 10px; align-items: center; }
.kvs .lbl, .kv .lbl { line-height: 1.15; }
.maps { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; margin: 0 -2px; scrollbar-width: none; }
.maps::-webkit-scrollbar { display: none; }
.mapc { position: relative; flex: 0 0 118px; height: 84px; border: 0; padding: 0; border-radius: 16px; overflow: hidden; text-align: start; background: linear-gradient(140deg, var(--c1), var(--c2)); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.14), 0 4px 0 rgba(0, 0, 0, 0.4); }
.mapc i { position: absolute; inset-inline-end: 8px; top: 4px; font-style: normal; font-size: 2rem; filter: drop-shadow(0 3px 0 rgba(0, 0, 0, 0.25)); }
.mapc b { position: absolute; inset-inline: 8px; bottom: 18px; font-size: 0.92rem; font-weight: 800; line-height: 1.05; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.45); }
.mapc small { position: absolute; inset-inline: 8px; bottom: 5px; font-size: 0.6rem; font-weight: 700; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.45); }
.mapc.on { box-shadow: inset 0 0 0 3px var(--yellow), 0 4px 0 rgba(0, 0, 0, 0.4); }
.mapc.on::after { content: "\2713"; position: absolute; inset-inline-start: 7px; top: 6px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; font-size: 0.8rem; font-weight: 800; color: var(--ink); background: var(--yellow); }
.summary { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 99px; font-size: 0.8rem; font-weight: 800; background: rgba(9, 12, 38, 0.65); box-shadow: inset 0 0 0 1.5px var(--line); }
.pill.y { color: var(--ink); background: var(--yellow); box-shadow: none; }
.fold { border-radius: 16px; background: rgba(9, 12, 38, 0.45); }
.fold summary { list-style: none; padding: 10px 12px; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
[dir="rtl"] .fold summary { letter-spacing: 0; font-size: 0.88rem; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "+"; font-size: 1.2rem; color: var(--text); }
.fold[open] summary::after { content: "\2212"; }
.foldbody { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 10px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; padding: 3px; border-radius: 14px; background: rgba(9, 12, 38, 0.75); }
.seg button { min-height: 34px; min-width: 0; padding: 3px 3px; border: 0; border-radius: 11px; font-weight: 700; font-size: 0.84rem; line-height: 1.1; color: var(--muted); background: none; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.seg button.on { background: linear-gradient(180deg, #6cf3f5, var(--cyan)); color: var(--ink); box-shadow: 0 3px 0 var(--cyan-edge); }
.step { display: flex; align-items: center; gap: 14px; }
.step button { width: 42px; height: 36px; border: 0; border-radius: 12px; font-weight: 800; font-size: 1.25rem; background: linear-gradient(180deg, var(--navy-3), var(--navy-2)); box-shadow: 0 3px 0 #0a0e33; }
.step button:active { transform: translateY(2px); box-shadow: 0 1px 0 #0a0e33; }
.step b { min-width: 1.2em; text-align: center; font-size: 1.15rem; font-variant-numeric: tabular-nums; }

/* ---- in-match HUD ---- */
.hud { position: absolute; inset: var(--st) var(--sr) var(--sb) var(--sl); pointer-events: none; }
.hud-top { position: absolute; top: 8px; inset-inline: 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 6px; }
.hud-top > button { pointer-events: auto; flex: none; }
.hud-mid { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.score { direction: ltr; max-width: 100%; display: flex; flex-wrap: nowrap; justify-content: center; gap: 4px; min-width: 0; padding: 5px 8px 4px; border-radius: 18px; background: rgba(9, 12, 38, 0.5); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.sc { position: relative; width: 56px; flex: 0 1 56px; min-width: 30px; display: flex; flex-direction: column; align-items: center; }
.sc img { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(180deg, #2c3790, #151b52); box-shadow: 0 0 0 2px var(--c); }
.sc b { margin-top: -9px; min-width: 24px; padding: 0 5px; border-radius: 9px; text-align: center; font-size: 0.9rem; font-weight: 800; line-height: 1.25; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--c); box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4); }
.sc i { display: block; max-width: 100%; margin-top: 1px; font-style: normal; font-size: 0.66rem; font-weight: 800; line-height: 1.2; color: rgba(244, 246, 255, 0.88); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
.score.many .sc { width: 46px; flex-basis: 46px; }
.score.many .sc img { width: 30px; height: 30px; }
.score.many .sc i { font-size: 0.6rem; }
.sc.me img { box-shadow: 0 0 0 2px var(--c), 0 0 0 3.5px var(--text); }
.sc.me i { color: var(--yellow); }
.sc.low b { background: #ff4f6a; color: #fff; }
@media (orientation: portrait) {                     /* tall screens have room above the arena: bigger faces, like Crash's row of heads */
  .sc { width: 66px; flex-basis: 66px; }
  .sc img { width: 44px; height: 44px; }
  .sc b { font-size: 1rem; margin-top: -10px; }
  .sc i { font-size: 0.72rem; }
  .score.many .sc { width: 48px; flex-basis: 48px; }
  .score.many .sc img { width: 34px; height: 34px; }
  .score.many .sc i { font-size: 0.62rem; }
}
.sc.out { opacity: 0.38; filter: grayscale(1); }
.sc.lead b { background: var(--yellow); }
.sc.hit { animation: scHit 0.5s ease-out; }
.hud-info { padding: 3px 14px; border-radius: 99px; font-size: 0.95rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-edge); }
.hud-info.hot { background: var(--pink); color: #fff; box-shadow: 0 3px 0 var(--pink-edge); animation: pulse 0.8s ease-in-out infinite; }
.hud-sub { position: absolute; top: 62px; inset-inline-start: 12px; display: flex; gap: 8px; align-items: center; }
.hud-code { display: none; font-weight: 800; letter-spacing: 0.14em; color: var(--yellow); font-size: 0.95rem; text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6); }
.hud-net { font-size: 0.7rem; font-weight: 700; color: var(--muted); background: rgba(9, 12, 38, 0.75); padding: 3px 8px; border-radius: 99px; font-variant-numeric: tabular-nums; }
.hud-net.good { color: var(--green); }
.hud-left { position: absolute; left: 12px; bottom: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; pointer-events: none; }
.hud-left > * { pointer-events: auto; }
.emotray { display: flex; gap: 6px; padding: 6px; border-radius: 99px; background: rgba(9, 12, 38, 0.86); box-shadow: inset 0 0 0 1.5px var(--line), 0 8px 20px rgba(0, 0, 0, 0.4); animation: trayIn 0.2s ease-out; }
.emotray button { width: 46px; height: 46px; border: 0; border-radius: 50%; font-size: 1.6rem; line-height: 1; background: rgba(170, 190, 255, 0.12); }
.emotray button:active { transform: scale(0.88); }
.mycard { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 14px 6px 6px; border-radius: 20px; background: rgba(9, 12, 38, 0.78); box-shadow: inset 0 0 0 2px var(--me), 0 4px 0 rgba(0, 0, 0, 0.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.mycard img { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(180deg, #2c3790, #151b52); }
.mycard b { display: block; font-size: 0.9rem; font-weight: 800; max-width: 9em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pips { display: flex; gap: 3px; margin-top: 2px; align-items: center; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; color: var(--me); }
.pips i { width: 10px; height: 10px; border-radius: 50%; background: var(--me); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25); }
.pips i.off { background: rgba(170, 190, 255, 0.2); }
.hint { position: absolute; bottom: 112px; left: 50%; transform: translateX(-50%); width: max-content; max-width: min(80%, 380px); padding: 6px 12px; border-radius: 12px; text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--text); background: rgba(9, 12, 38, 0.72); pointer-events: none; }
.smash {
  position: absolute; right: 16px; bottom: 18px; width: 76px; height: 76px; border: 0; border-radius: 50%; padding: 0; pointer-events: auto; opacity: 0.6;
  font-size: 0.86rem; font-weight: 800; color: #fff; touch-action: none; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35); transition: opacity 0.2s;
  background: conic-gradient(rgba(9, 12, 38, 0.7) var(--cd, 0deg), rgba(9, 12, 38, 0) 0deg), radial-gradient(circle at 50% 30%, #ff8fab, var(--pink) 55%, var(--pink-2));
  box-shadow: 0 4px 0 var(--pink-edge), 0 0 0 3px rgba(9, 12, 38, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.4);
}
.smash.ready { opacity: 0.92; }
.skip { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); pointer-events: auto; border: 0; padding: 12px 22px; border-radius: 99px; font: inherit; font-weight: 800; font-size: 1rem; color: var(--ink); background: var(--yellow); box-shadow: 0 4px 0 var(--yellow-edge); }
.skip:active { transform: translate(-50%, 3px); box-shadow: 0 1px 0 var(--yellow-edge); }
.smash:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-edge), 0 0 0 3px rgba(9, 12, 38, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.4); }

.tag { position: absolute; left: 0; top: 0; padding: 2px 10px; border-radius: 99px; font-size: 0.76rem; font-weight: 800; white-space: nowrap; color: var(--text); background: rgba(9, 12, 38, 0.86); box-shadow: inset 0 0 0 2px var(--c, var(--line)); will-change: transform; }
.tag.me { color: var(--ink); background: var(--yellow); box-shadow: 0 3px 0 var(--yellow-edge); }
.float { position: absolute; transform: translate(-50%, -50%); font-size: 1.35rem; font-weight: 800; -webkit-text-stroke: 1px rgba(9, 12, 38, 0.8); text-shadow: 0 3px 0 var(--ink), 0 0 10px var(--ink); animation: floatUp 0.95s ease-out forwards; white-space: nowrap; pointer-events: none; }
.float.big { font-size: 1.9rem; }

/* ---- name + lives/points badge over every rival ---- */
.gb { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 99px; background: rgba(9, 12, 38, 0.88); box-shadow: inset 0 0 0 2px var(--c, var(--line)), 0 3px 8px rgba(0, 0, 0, 0.4); will-change: transform; white-space: nowrap; }
[dir="rtl"] .gb { padding: 2px 2px 2px 8px; }
.gb img { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(180deg, #2c3790, #151b52); flex: none; }
.gb i { order: 1; font-style: normal; font-size: 0.7rem; font-weight: 800; color: var(--text); max-width: 6.5em; overflow: hidden; text-overflow: ellipsis; }
.gb b { order: 2; display: inline-flex; align-items: center; gap: 2px; padding: 0 5px; border-radius: 99px; font-size: 0.82rem; font-weight: 800; line-height: 1.3; color: var(--ink); background: var(--c); font-variant-numeric: tabular-nums; }
.gb b::before { content: "\2665"; font-size: 0.66rem; }
.gb.pts b::before { content: "\2605"; }
.gb.low { animation: lowPulse 0.8s ease-in-out infinite; }
.gb.low b { background: #ff4f6a; color: #fff; }
.gb.out { opacity: 0.55; filter: grayscale(1); }
.gb.out b::before { content: ""; }
.gb.hit { animation: gbHit 0.6s ease-out; }

/* ---- taunt bubbles ---- */

.award { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 16px; background: rgba(9, 12, 38, 0.55); box-shadow: inset 0 0 0 2px var(--c); min-width: 0; }

@keyframes pulse { 0%, 100% { filter: brightness(1); } 50% { filter: brightness(1.18); } }
@keyframes floatUp { 0% { opacity: 0; transform: translate(-50%, -30%) scale(0.6); } 15% { opacity: 1; transform: translate(-50%, -60%) scale(1.15); } 100% { opacity: 0; transform: translate(-50%, -190%) scale(1); } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";
/* ================= SIM =================
   Pure game rules. The arena is a regular polygon: a square for 2-4 players, then
   one side per player up to an octagon. Every side sits 1 unit from the centre.
   Each player owns one side and slides a bumper along its goal; sides with nobody
   on them, and the goals of knocked-out players, are solid walls. The same code
   runs on the host (full rules) and on joined phones (prediction between updates). */
var TAU = Math.PI * 2;
var BR = 0.04;                  // pearl radius
var AP = 1;                     // centre to each side
var RC = AP - BR - 0.012;       // where a pearl meets a side
var CORNER_R = 0.075;           // round bumpers in the corners
var CORE_R = 0.115;             // the optional launcher in the middle
var GOAL_F = 0.74, GOAL_MAX = 0.8;   // goal mouth as a share of the side
var PAD_F = 0.26, PAD_MAX = 0.26;    // bumper width as a share of the side
var OMEGA = 3.2;                // bumper speed limit, units per second
var BASE_SP = 0.8, CAP_SP = 1.5, SMASH_CAP = 2.05;
var TELE = 0.75;                // warning time before a pearl comes in
var LIVE = 0, PEND = 1;
var STEP = 1 / 120;
var MODE_LIVES = 0, MODE_POINTS = 1, MODE_TIME = 2;
var POINTS_CAP = 600;
/* Arena size: Small is the original; Medium and Large make the arena bigger next to the
   pearls, bumpers, corner posts and players (everything else is measured from the arena). */
var SIZES = [1, 1.3, 1.6], SIZE = 1, SZ = 1;
function setSize(k) {
  SIZE = SIZES[k | 0] || 1; SZ = Math.pow(SIZE, 0.75);
  BR = 0.04 / SZ; RC = AP - BR - 0.012; CORNER_R = 0.075 / SIZE; CORE_R = 0.115 / SZ;
  PAD_F = PAD_MAX = 0.26 / SZ;
}           // a points match that drags on ends after 10 minutes

function angd(a, b) { var d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function r3(v) { return Math.round(v * 1000) / 1000; }
function r4(v) { return Math.round(v * 10000) / 10000; }
function hash3(a, b, c) {
  var h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263) + Math.imul(c | 0, 1274126177)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* ---------- arena shape ---------- */
function sideCount(n) { return n === 3 ? 6 : Math.max(4, n); }            // 3 players sit on every other side of a hexagon, so nobody has a better spot
function seatSides(n) { return n === 2 ? [0, 2] : n === 3 ? [0, 2, 4] : Array.from({ length: n }, function (_, i) { return i; }); }
function makeSides(K) {
  var out = [], L = AP * Math.tan(Math.PI / K);
  for (var i = 0; i < K; i++) { var a = i * TAU / K; out.push({ i: i, a: a, c: Math.cos(a), s: Math.sin(a), L: L, seat: -1 }); }
  return out;
}
function cornerPosts(K) {
  var out = [], rv = AP / Math.cos(Math.PI / K);
  for (var i = 0; i < K; i++) { var a = i * TAU / K + Math.PI / K; out.push({ x: Math.cos(a) * rv, y: Math.sin(a) * rv, r: CORNER_R, corner: 1 }); }
  return out;
}

/* ---------- map layouts: what stands on the floor ---------- */
var LAYOUTS = [
  { k: 'classic', obs: function () { return []; } },
  { k: 'pillars', obs: function (S) {                                   // a ring of pillars pointing at the corners
    var n = S.K, out = [];
    for (var i = 0; i < n; i++) { var a = (i + 0.5) * TAU / n; out.push({ x: Math.cos(a) * 0.5, y: Math.sin(a) * 0.5, r: (n > 4 ? 0.055 : 0.07) / SZ }); }
    return out;
  } },
  { k: 'orbit', obs: function (S) {                                     // three bumpers circling the middle
    var out = [];
    for (var i = 0; i < 3; i++) { var a = S.t * 0.45 + i * TAU / 3; out.push({ x: Math.cos(a) * 0.46, y: Math.sin(a) * 0.46, r: 0.065 / SZ, mv: 1 }); }
    return out;
  } },
  { k: 'whirl', obs: function () { return []; }, whirl: 1.7 }               // a whirlpool that bends pearls through the middle
];
var WHIRL_R = 0.42;

function newMatch(roster, cfg) {
  setSize(cfg.size);
  var n = roster.length, K = sideCount(n), sides = makeSides(K), ss = seatSides(n);
  var lay = (cfg.hazards && LAYOUTS[cfg.layout | 0]) || LAYOUTS[0];             // map obstacles are an option, off unless the host turns them on
  var S = {
    t: 0, tick: 0, phase: 'cd', cdShown: 4, cfg: cfg, seed: (Math.random() * 1e6) | 0,
    K: K, sides: sides, corners: cornerPosts(K), lay: lay, whirl: lay.whirl || 0,
    players: [], balls: [], orbs: [], posts: [], ev: [], eid: 0, noEv: false,
    core: { next: -1, tele: null, spin: 0 }, endT: 0, ot: false,
    nextBall: 1, nextOrb: 1, orbAt: 7, ballsWanted: Math.max(1, Math.round(n / 2.5)), moreAt: 12, places: n, winner: -1, overAt: 0
  };
  roster.forEach(function (r, i) {
    var sd = sides[ss[i]]; sd.seat = i;
    S.players.push({
      seat: i, id: r.id, name: r.name, ch: r.ch, col: r.col, bot: !!r.bot, remote: !!r.remote, conn: true,
      side: sd.i, a0: sd.a, L: sd.L, alive: true, lives: cfg.lives, pts: 0, conc: 0,
      p: 0, pt: 0, pn: 0, pv: 0, pvel: 0, smashUntil: -1, smashCd: 0, smashN: 0, smashOn: false,
      wideUntil: -1, wide: false, shield: false, shieldUntil: -1, guardUntil: -1, guard: false,
      score: 0, saves: 0, place: 0, lat: 0, lastIn: 0, botT: Math.random() * 0.1, lastAimed: -9
    });

  return S;
}

function ev(S, a) { if (S.noEv) return; S.ev.push([++S.eid, S.t].concat(a)); }
function ramp(S) { return Math.min(0.55, Math.max(0, S.t - 4) / 160); }
function speedK(S) { return S.cfg.speed * (1 + ramp(S)); }
function goalHalf(pl) { return Math.min(GOAL_MAX, pl.L * GOAL_F); }
function padHalf(pl) { return Math.min(PAD_MAX, pl.L * PAD_F) * (pl.wide ? 1.5 : 1); }
function padSpan(pl) { return Math.max(0.001, goalHalf(pl) - padHalf(pl) * 0.55); }
function padU(pl) { return pl.p * padSpan(pl); }
function aliveList(S) { return S.players.filter(function (p) { return p.alive; }); }
/* where a side's point u sits in the arena (x, y) */
function sidePt(sd, u, d) { d = d == null ? AP : d; return { x: sd.c * d - sd.s * u, y: sd.s * d + sd.c * u }; }
function padXY(S, pl) { return sidePt(S.sides[pl.side], padU(pl), AP); }
function sideOf(S, x, y) {
  var best = 0, bd = -9;
  for (var i = 0; i < S.K; i++) { var sd = S.sides[i], dn = x * sd.c + y * sd.s; if (dn > bd) { bd = dn; best = i; } }
  return best;
}
function sideOwner(S, si) { var sd = S.sides[si]; return sd ? sd.seat : -1; }

function trySmash(S, pl) {
  if (S.t < pl.smashCd || !pl.alive) return false;
  pl.smashUntil = S.t + 0.32; pl.smashCd = S.t + 2.6;
  ev(S, ['smash', pl.seat]);

}

function reflectSide(b, sd, u) {
  var nx = sd.c, ny = sd.s, vr = b.vx * nx + b.vy * ny;
  b.vx -= 2 * vr * nx; b.vy -= 2 * vr * ny;
  // keep it from skimming along the wall forever
  var sp = Math.hypot(b.vx, b.vy), inw = -(b.vx * nx + b.vy * ny);
  if (inw < sp * 0.35) {
    var tx = -ny, ty = nx, vt = b.vx * tx + b.vy * ty, s = vt < 0 ? -1 : 1;
    b.vx = sp * (-nx * 0.35 + tx * s * 0.937); b.vy = sp * (-ny * 0.35 + ty * s * 0.937);

function doHit(S, b, pl, sd, u) {

  var nx = sd.c, ny = sd.s, tx = -ny, ty = nx;
  var vr = b.vx * nx + b.vy * ny, vt = b.vx * tx + b.vy * ty;
  var sp = Math.hypot(b.vx, b.vy);
  var refl = Math.atan2(vt, Math.max(1e-6, vr));
  var ang = clamp(0.4 * refl + 0.62 * off + clamp(pl.pv, -3, 3) * 0.06, -1.12, 1.12);
  var k = speedK(S), smash = t < pl.smashUntil;
  var ns = Math.max(BASE_SP * k * 0.92, Math.min(CAP_SP * k, sp * 1.04 + 0.012));
  if (smash) { ns = Math.min(SMASH_CAP * k, Math.max(sp * 1.4, BASE_SP * k * 1.55)); b.hotUntil = t + 1.3; pl.smashUntil = -1; }
  b.vx = ns * (-nx * Math.cos(ang) + tx * Math.sin(ang));
  b.vy = ns * (-ny * Math.cos(ang) + ty * Math.sin(ang));
  var p = sidePt(sd, u, RC - 0.004); b.x = p.x; b.y = p.y;
  b.owner = pl.seat; b.seq++; b.tent = -1; b.st = LIVE;
  pl.saves++;
  return smash;
}

function useShield(S, pl) {
  if (pl.guard) return false;
  if (pl.shield) { pl.shield = false; ev(S, ['shieldoff', pl.seat]); return true; }
  return false;
}

function finish(S, winner) {

  if (!$('menu').hidden) { $('menu').hidden = true; if (UI.paused && UI.screen === 'game' && G.S && G.S.phase === 'play') musicStart(); }
  UI.paused = false; frame.last = 0;
}
function wakeLock() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(function () {}); } catch (e) {} }

/* ---------- wiring ---------- */
function movePt(dx) {
  var S = G.S, me = S && S.players[G.me]; if (!me || !me.alive) return;
  INPUT.pt = clamp(clamp(INPUT.pt, me.p - 0.9, me.p + 0.9) + VIEW.padDir * 1.35 * dx / (VIEW.pxPerUnit * padSpan(me)), -1, 1);
}
function hostSet(fn) { return function (e) { var b = e.target.closest('button'); if (!b || !(ROOM.role === 'host' || ROOM.role === 'solo')) return; sfx('click'); fn(b.getAttribute('data-v')); sendLobby(); renderLobby(); }; }
function initUI() {
  var hadProfile = loadProfile();
  $('splash').hidden = true;
  if (!window.THREE || !gfxInit()) { $('nogl').hidden = false; $('nogl').firstChild.textContent = T('nogl'); return; }
  gfxQuality(UI.gfx);
  UI.homeMap = (Math.random() * MAPS.length) | 0;
  showScreen('home'); gfxResize();
  buildPickers();
  $('in-name').value = ME.name;
  if (PREVIEW) { $('online').hidden = true; $('preview-note').hidden = false; $('b-solo').classList.add('primary', 'big'); $('b-solo').classList.remove('ghost'); }
  applyStrings();

  $('in-name').addEventListener('input', function () { ME.name = this.value.slice(0, 12); saveProfile(); });
  $('in-code').addEventListener('input', function () { this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); });
  $('in-code').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('b-join').click(); });
  $('b-lang').addEventListener('click', function () { sfx('click'); setLang(LANG === 'ar' ? 'en' : 'ar'); });
  $('seg-lang').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; sfx('click'); setLang(b.getAttribute('data-v')); seg('seg-lang', LANG); });
  $('langpick').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; auInit(); sfx('click'); setLang(b.getAttribute('data-v')); $('langpick').hidden = true;
    if (!UI.howSeen) setTimeout(function () { if (UI.screen === 'home') $('howto').hidden = false; }, 250);
  });
  $('b-prev').addEventListener('click', function () { pickChar(ME.ch - 1); });
  $('b-next').addEventListener('click', function () { pickChar(ME.ch + 1); });
  $('b-create').addEventListener('click', function () { auInit(); sfx('click'); createRoom(); });
  $('b-join').addEventListener('click', function () { auInit(); sfx('click'); joinRoom($('in-code').value); });
  $('b-solo').addEventListener('click', function () { auInit(); sfx('click'); soloRoom(); });
  $('b-leave').addEventListener('click', function () { sfx('click'); leaveRoom(); });
  $('b-res-leave').addEventListener('click', function () { sfx('click'); leaveRoom(); });
  $('b-start').addEventListener('click', function () { auInit(); sfx('click'); hostStart(); });
  $('b-again').addEventListener('click', function () { auInit(); sfx('click'); hostStart(); });
  $('b-res-room').addEventListener('click', function () { sfx('click'); hostToRoom(); });
  $('b-copy').addEventListener('click', function () {
    var url = roomUrl(), txt = 'Sadda ' + ROOM.code + ' ' + url;
    function copied() { toast(T('copied')); }
    function fallback() { var i = $('in-link'); i.hidden = false; i.value = url; i.focus(); i.select(); }
    if (navigator.share && /^https?:$/.test(location.protocol)) { navigator.share({ title: 'Sadda', text: 'Sadda ' + ROOM.code, url: url }).catch(function () {}); return; }
    try { navigator.clipboard.writeText(txt).then(copied, fallback); } catch (e) { fallback(); }
  });
  $('bots-minus').addEventListener('click', function () { sfx('click'); ROOM.bots = Math.max(0, ROOM.seats.filter(function (x) { return x.bot; }).length - 1); syncBots(); sendLobby(); renderLobby(); });
  $('bots-plus').addEventListener('click', function () { sfx('click'); ROOM.bots = Math.min(8 - humans().length, ROOM.seats.filter(function (x) { return x.bot; }).length + 1); syncBots(); sendLobby(); renderLobby(); });
  $('modes').addEventListener('click', hostSet(function (v) { ROOM.cfg.mode = ci(v, 0, 2); }));
  $('seg-tgt').addEventListener('click', hostSet(function (v) { var c = ROOM.cfg; c[['lives', 'pts', 'mins'][c.mode | 0]] = +v; }));
  $('maps').addEventListener('click', hostSet(function (v) { ROOM.cfg.map = ci(v, -1, MAPS.length - 1); if (ROOM.cfg.map >= 0) ROOM.mapNow = ROOM.cfg.map; }));
  [['seg-speed', 'sp'], ['seg-level', 'bot'], ['seg-pw', 'pw'], ['seg-core', 'core'], ['seg-haz', 'haz'], ['seg-size', 'size']].forEach(function (d) {
    $(d[0]).addEventListener('click', hostSet(function (v) { ROOM.cfg[d[1]] = +v; }));
  });
  $('fold-look').addEventListener('toggle', function () { refreshPickers(); gfxResize(); });
  $('b-menu').addEventListener('click', function () { sfx('click'); openMenu(); });
  $('b-settings').addEventListener('click', function () { auInit(); sfx('click'); openMenu(); });
  $('b-resume').addEventListener('click', function () { sfx('click'); closeMenu(); });
  $('b-close').addEventListener('click', function () { sfx('click'); closeMenu(); });
  $('menu').addEventListener('click', function (e) { if (e.target === this) closeMenu(); });
  $('t-snd').addEventListener('click', function () { auInit(); AU.on = !AU.on; saveProfile(); soundButtons(); sfx('click'); });
  $('t-mus').addEventListener('click', function () { auInit(); AU.musicOn = !AU.musicOn; saveProfile(); soundButtons(); sfx('click'); });
  $('t-vib').addEventListener('click', function () { AU.vib = AU.vib === false; saveProfile(); soundButtons(); sfx('click'); buzz(30); });
  $('seg-gfx').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; sfx('click'); gfxQuality(b.getAttribute('data-v')); saveProfile(); seg('seg-gfx', GFX.quality); });
  $('b-quit').addEventListener('click', function () {
    var now = performance.now();
    if (UI.quitArmed && now < UI.quitArmed) { closeMenu(); leaveRoom(); return; }
    UI.quitArmed = now + 2600; this.classList.add('armed'); this.textContent = T('leave2');
  });
  initComms();
  $('b-tolobby').addEventListener('click', function () { sfx('click'); closeMenu(); hostToRoom(); });
  $('b-skip').addEventListener('click', function () { sfx('click'); hostSkip(); });
  $('b-emote').addEventListener('click', function () { auInit(); $('emotray').hidden = !$('emotray').hidden; });
  $('emotray').addEventListener('click', function (e) { var b = e.target.closest('button'); if (!b) return; INPUT.emoQ = +b.getAttribute('data-k'); $('emotray').hidden = true; });
  $('b-help').addEventListener('click', function () { sfx('click'); $('howto').hidden = false; });
  $('b-how2').addEventListener('click', function () { sfx('click'); $('howto').hidden = false; });
  $('b-howok').addEventListener('click', function () { sfx('click'); $('howto').hidden = true; UI.howSeen = true; saveProfile(); });
  var sb = $('b-smash');
  sb.addEventListener('pointerdown', function (e) { e.preventDefault(); auInit(); INPUT.smashQ = true; });
  sb.addEventListener('click', function (e) { e.preventDefault(); });

  cv.addEventListener('pointerdown', function (e) {
    if (UI.screen !== 'game') return; auInit();
    if (commsOn() && e.pointerType === 'touch' && (e.clientX < Math.min(28, innerWidth * 0.07) || e.clientX > innerWidth - Math.min(28, innerWidth * 0.07))) return;   // the screen edges open the chat
    if (UI.drag && e.pointerId !== UI.drag.id) { INPUT.smashQ = true; return; }
    UI.drag = { id: e.pointerId, x: e.clientX, t: performance.now(), moved: 0 };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) {
    var d = UI.drag; if (!d || e.pointerId !== d.id) return;
    var dx = e.clientX - d.x; d.x = e.clientX; d.moved += Math.abs(dx); movePt(dx);
    if (d.moved > 30 && UI.hintUntil > performance.now() + 600) UI.hintUntil = performance.now() + 600;
  });
  function up(e) {
    var d = UI.drag; if (!d || e.pointerId !== d.id) return;
    UI.drag = null;
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  document.addEventListener('touchmove', function (e) { if (UI.screen === 'game' && (e.target === cv || $('hud').contains(e.target))) e.preventDefault(); }, { passive: false });
  cv.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
  window.addEventListener('keydown', function (e) {
    if (UI.screen !== 'game') return;
    if (e.key === 'Escape') { if ($('menu').hidden) openMenu(); else closeMenu(); return; }
    if (e.key === 't' || e.key === 'T') { INPUT.emoQ = (Math.random() * 4) | 0; return; }
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { INPUT.left = true; e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { INPUT.right = true; e.preventDefault(); }
    else if (e.key === ' ' || e.key === 'ArrowUp') { if (!e.repeat) INPUT.smashQ = true; e.preventDefault(); }
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') INPUT.left = false;
    else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') INPUT.right = false;
  });
  window.addEventListener('resize', gfxResize);
  window.addEventListener('orientationchange', function () { setTimeout(gfxResize, 250); });
  if (window.ResizeObserver) new ResizeObserver(function (en) {                 // the camera keeps the arena under the score row
    var h = Math.round(en[0].contentRect.height); if (UI.screen === 'game' && h && Math.abs(h - (UI.topH || 0)) > 1) { UI.topH = h; gfxResize(); }
  }).observe(document.querySelector('.hud-top'));
  document.addEventListener('visibilitychange', function () { if (document.hidden) return; if (UI.screen === 'game') wakeLock(); G.lastHost = performance.now(); ROOM.tickAt = 0; });
  window.addEventListener('pagehide', function () { if (ROOM.role === 'host') hostBroadcast(['bye']); else if (ROOM.role === 'client') clientRelay(['bye']); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { gfxResize(); });

  var debug = /[?&]debug/.test(location.search);
  if (!debug) {
    if (!UI.langSet) $('langpick').hidden = false;
    else if (!UI.howSeen) setTimeout(function () { if (UI.screen === 'home') $('howto').hidden = false; }, 900);
  }
  if (debug) window.__sadda = DBG = { VO: VO, CHAT: CHAT, chatSend: chatSend, G: G, ROOM: ROOM, NET: NET, INPUT: INPUT, GFX: GFX, VIEW: VIEW, UI: UI, auto: false, portrait: portraitURL, fx: fxEvent, title: showTitle, toast: toast, norender: /[?&]norender/.test(location.search) };
  requestAnimationFrame(frame);

  // opened from an invite link or QR: #CODE
  var code = (location.hash || '').replace('#', '').toUpperCase();
  if (!PREVIEW && /^[A-Z]{4}$/.test(code)) {
    $('in-code').value = code;
    if (hadProfile) { $('langpick').hidden = true; joinRoom(code); } else { $('b-join').classList.add('pulse'); $('in-name').focus(); }
  }
}

initUI();
})();
</script>
</body>
</html>
