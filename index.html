  box.appendChild(track); box.appendChild(el('p', 'note info', T('passNote')));
  setTimeout(function () { var c = track.querySelector('.rw.can'), nx = c ? c.closest('.tcol') : track.querySelector('.next'); if (nx) { var tr = track.getBoundingClientRect(), r = nx.getBoundingClientRect(), rtl = document.documentElement.dir === 'rtl'; track.scrollLeft += rtl ? r.right - (tr.right - 64) : r.left - (tr.left + 64); }}, 30);
}
function renderChallenges() {
  challengesFresh();
  var box = $('pass-c'); box.textContent = '';
  if (chClaimable() > 1) { var all = el('button', 'btn primary sm chall', T('collectAll')); all.type = 'button'; all.setAttribute('data-chc', 'all'); box.appendChild(all); }
  [['d', 'dailyCh', ECO.ch.d, msToNextDay()], ['w', 'weeklyCh', ECO.ch.w, weekLeft()]].forEach(function (G0) {
    var hd = el('div', 'shead'); hd.appendChild(el('b', null, T(G0[1]))); hd.appendChild(el('small', 'stime', T('resetIn', { t: fmtLeft(G0[3]) }))); box.appendChild(hd);
    G0[2].forEach(function (c, ci) {
      var row = el('div', 'chrow' + (c.done ? (c.got ? ' got' : ' done') : '')), tx = el('div', 'chtx');
      tx.appendChild(el('b', null, chalName(c)));
      var bar = el('div', 'rc-bar'), f = el('i'); f.style.width = Math.round(c.v / c.n * 100) + '%'; bar.appendChild(f); tx.appendChild(bar);
      tx.appendChild(el('small', null, c.v + ' / ' + c.n)); row.appendChild(tx);
      var rw = CH_REW[G0[0]], rws = el('div', 'chrw'); rws.appendChild(rewardChip({ c: rw.c })); if (rw.g) rws.appendChild(rewardChip({ g: rw.g })); var xp = el('div', 'rw xp'); xp.innerHTML = '<b>+' + rw.xp + '</b><small>XP</small>'; rws.appendChild(xp);
      row.appendChild(rws);
      if (c.done && !c.got) { var cb = el('button', 'btn primary xs chget', T('collect')); cb.type = 'button'; cb.setAttribute('data-chc', G0[0] + ci); row.appendChild(cb); }
      else if (c.got) { var ok = el('span', 'chok'); ok.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3.5 8.4l3 2.9 6-6.3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span></span>'; ok.lastChild.textContent = T('collected'); row.appendChild(ok); }
      box.appendChild(row);
    });
  });
}
/* collecting a finished challenge (or all of them) */
function chClick(e) {
  var b = e.target.closest('[data-chc]'); if (!b) return;
  var k = b.getAttribute('data-chc'), keys = [], tot = { c: 0, g: 0, xp: 0, up: 0 };
  if (k === 'all') { ['d', 'w'].forEach(function (kind) { chList(kind).forEach(function (c, i) { if (c.done && !c.got) keys.push([kind, i]); }); }); }
  else keys.push([k.charAt(0), +k.slice(1)]);
  keys.forEach(function (q) { var r = chClaim(q[0], q[1]); if (r) { tot.c += r.c; tot.g += r.g; tot.xp += r.xp; if (r.tierUp) tot.up = r.tierUp; } });
  if (!tot.c && !tot.g) return;
  sfx('orb'); buzz(25);
  flyCoins(b, 'c', Math.min(9, 4 + keys.length * 2)); if (tot.g) setTimeout(function () { flyCoins(b, 'g', 4); }, 120);
  walletUI(true); railBadges(); renderChallenges();
  toast(T(tot.g ? 'gotCG' : 'gotC', { c: fmtN(tot.c), g: tot.g, x: tot.xp }), 2000);
  if (tot.up) setTimeout(function () { toast(T('passTierUp', { n: tot.up }), 2200); }, 2100);
}
function weekLeft() { var d = new Date(), t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()), wk = Math.floor((t / 864e5 + 3) / 7); return ((wk + 1) * 7 - 3) * 864e5 - d.getTime(); }
function passClick(e) {
  var b = e.target.closest('[data-claim], #b-buypass, #b-claimall'); if (!b) return;
  if (b.id === 'b-buypass') {
    if (ECO.gems < PASS_PRICE) { sfx('click'); toast(T('notEnough', { c: T('gemsN') })); closeSheet('passsheet'); openShop('g'); return; }
    if (!b.classList.contains('armed')) { sfx('click'); b.classList.add('armed'); toast(T('buyQ'), 1500); return; }
    if (buyPass()) { sfx('crown', true); buzz([30, 40, 30]); showTitle(T('premOn'), T('seasonT', { n: SEASON_NAME[LANG === 'ar' ? 1 : 0] }), 'win', 1800, '#ff3dbb'); walletUI(); renderPass(); }
    return;
  }
  var keys = b.id === 'b-claimall' ? null : [b.getAttribute('data-claim')], n = 0;
  if (!keys) { keys = []; for (var i = 0; i < passTier(); i++) { keys.push('f' + i); keys.push('p' + i); } }
  var gotItem = null;
  keys.forEach(function (k) { var i2 = +k.slice(1), pr = k.charAt(0) === 'p', r = (pr ? PASS_PREM : PASS_FREE)[i2]; if (passClaim(i2, pr)) { n++; if (r && r.it && ITEM[r.it]) gotItem = ITEM[r.it]; } });
  if (n) { sfx('orb'); buzz(25); tauntTray(); walletUI(); renderPass(); if (gotItem) revealItem(gotItem); }   // a new item gets its moment
}

/* ---------- results: what this match paid ---------- */
function resEco(S) {
  var box = $('res-eco'), r = G.ecoRes; if (!r || G.ecoMid !== G.mid) { box.hidden = true; return; }
  box.textContent = ''; box.hidden = false;
  if (r.practice) { box.appendChild(el('span', 'rchip prac', T('practiceNote'))); return; }
  var c = el('span', 'rchip coin'); c.innerHTML = curIcon('c') + '<b>+' + r.coins + '</b><small>' + T('matchT') + '</small>'; box.appendChild(c);
  (r.lv || []).forEach(function (l) { var lc = el('span', 'rchip coin'); lc.innerHTML = curIcon('c') + '<b>+' + l.c + '</b>' + (l.g ? curIcon('g') + '<b>+' + l.g + '</b>' : '') + '<small>' + T('lvShort', { n: l.lv }) + '</small>'; box.appendChild(lc); });
  var x = el('span', 'rchip xp'); x.innerHTML = '<b>+' + r.pxp + '</b><small>' + T('passXP') + '</small>'; box.appendChild(x);
  r.done.forEach(function (d) { var ch = el('button', 'rchip done'); ch.type = 'button'; ch.innerHTML = '<span></span><em></em>'; ch.firstChild.textContent = chalName(d.c); ch.lastChild.textContent = T('collect'); ch.addEventListener('click', function () { sfx('click'); openPass('c'); }); box.appendChild(ch); });
  var w = el('div', 'rwal'); w.innerHTML = '<small></small>' + curIcon('c') + '<b dir="ltr"></b>'; w.firstChild.textContent = T('walletT'); box.appendChild(w);
  var wb = w.lastChild; wb._v = r.before; wb.textContent = fmtN(r.before); setTimeout(function () { countTo(wb, r.after, true); }, 700);
}
function ecoAfterMatch(S, gain, before, after) {
  if (G.ecoMid === G.mid || !ECO) return;
  var c0 = ECO.coins; G.ecoMid = G.mid; G.ecoRes = ecoMatch(S, gain);
  if (G.ecoRes && !G.ecoRes.practice) {                                     // a level up pays too, and the results show every coin of it
    G.ecoRes.lv = [];
    for (var lv = before + 1; lv <= after; lv++) { var lr = ecoLevelUp(lv); G.ecoRes.lv.push({ lv: lv, c: lr.c, g: lr.g }); }
    G.ecoRes.before = c0; G.ecoRes.after = ECO.coins;
  }
  walletUI();
}

function shopUIInit() {
  ecoLoad(); tauntTray();
  $('rv-equip').addEventListener('click', function () { var k = UI.revealK; sfx('click'); if (k) { equip(k); tauntTray(); if (UI.shopTab === 'l') renderLocker(UI.lockCat); else renderShop(); toast(T('equipped'), 1200); } revealClose(); });
  $('rv-later').addEventListener('click', function () { sfx('click'); revealClose(); });
  $('reveal').addEventListener('click', function (e) { if (e.target === this) revealClose(); });
  $('b-shop').addEventListener('click', function () { auInit(); sfx('click'); openShop('s'); });
  $('b-pass').addEventListener('click', function () { auInit(); sfx('click'); openPass('p'); });
  $('w-coins').addEventListener('click', function () { auInit(); sfx('click'); openShop('s'); });
  $('w-gems').addEventListener('click', function () { auInit(); sfx('click'); openShop('g'); });
  $('shop-tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { sfx('click'); shopTab(b.getAttribute('data-v')); } });
  $('pass-tabs').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { sfx('click'); passTab(b.getAttribute('data-v')); } });
  ['shop-s', 'shop-l', 'shop-g'].forEach(function (id) { $(id).addEventListener('click', shopClick); });
  $('pass-p').addEventListener('click', passClick);
  $('pass-c').addEventListener('click', chClick);
  ['shopsheet', 'passsheet'].forEach(function (id) { $(id).addEventListener('click', function (e) { if (e.target === this || e.target.closest('[data-close]')) { sfx('click'); closeSheet(id); } }); });
  walletUI();
  if (!store('sadda.ecoHi')) { store('sadda.ecoHi', 1); setTimeout(function () { if (UI.screen === 'home') toast(T('welcomeGift'), 3200); }, 2600); }
}

initUI();
})();
